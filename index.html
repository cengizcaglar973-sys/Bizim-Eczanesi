<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nöbetçi Eczaneler</title>

<style>
:root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #111;
}

body.dark {
    --bg: #0e0e0e;
    --card: #1a1a1a;
    --text: #fff;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* 🔥 ÜST BAŞLIK */
.header {
    text-align: center;
    padding: 20px;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(45deg, #ff0000, #ff7300);
    color: white;
}

/* DARK MODE BUTTON */
.toggle {
    position: fixed;
    top: 15px;
    right: 15px;
    background: black;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    max-width: 420px;
    margin: 20px auto;
    padding: 10px;
}

.card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* SELECT */
select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    border: none;
    outline: none;
}

/* LOADING */
.loader {
    text-align: center;
    padding: 10px;
    font-size: 14px;
    display: none;
}

/* iframe override */
iframe {
    height: 420px !important;
    border-radius: 8px;
}

/* FOOTER */
.footer {
    text-align: center;
    font-size: 13px;
    padding: 20px;
    opacity: 0.7;
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<div class="header">
🚨 BİZİM ECZANESİ - SULTANHANI NÖBETÇİ ECZANE
</div>

<div class="container">
<div class="card">

<select onchange="degistir(this.value)">
  <option value="2106">Sultanhanı</option>
  <option value="2101">Aksaray Merkez</option>
</select>

<div class="loader" id="loader">Yükleniyor...</div>

<!-- 🔥 SENİN KODUN (AYNEN KORUNDU) -->
<div style="margin:auto;text-align:center;width:100%;max-width:400px;">
<a href="https://www.eczaneler.gen.tr/nobetci-aksaray-sultanhani" target="_blank">
<img src="https://www.eczaneler.gen.tr/resimler/nobetci-eczane.jpg" 
alt="Sultanhanı nöbetçi eczaneleri" style="width:100%;border-radius:2px;">
</a>

<iframe src="https://www.eczaneler.gen.tr/iframe.php?lokasyon=2106" 
name="Sultanhanı nöbetçi eczaneleri" 
style="width:100%;height:240px;border:none;"></iframe>
</div>

</div>
</div>

<div class="footer">
powered by Cengiz
</div>

<script>
function degistir(id){
    document.getElementById("loader").style.display = "block";

    const iframe = document.querySelector("iframe");
    iframe.src = "https://www.eczaneler.gen.tr/iframe.php?lokasyon=" + id;

    iframe.onload = () => {
        document.getElementById("loader").style.display = "none";
    }
}

/* DARK MODE */
function toggleMode(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
